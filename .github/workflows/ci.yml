name: Rust CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    name: test ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.94
          - stable
          - nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - name: Check
        run: cargo check -p evm-sqlite
      - name: Fmt
        if: matrix.rust == 'stable'
        run: cargo fmt -p evm-sqlite --check
      - name: Lint
        if: matrix.rust == 'stable'
        run: cargo clippy -p evm-sqlite --all-features -- -D warnings
      - name: Audit
        if: matrix.rust == 'stable'
        run: cargo audit
      - name: Run tests
        run: cargo test -p evm-sqlite --lib -- --nocapture
